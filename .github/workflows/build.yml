name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Flet
        run: pip install flet

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 编译生成 APK
        run: flet build apk

      - name: 上传打包结果
        uses: actions/upload-artifact@v3
        with:
          name: VocabApp-APK
          path: build/apk/app-release.apk
